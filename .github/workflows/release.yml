name: Release

# 打 tag 时自动构建 mac (arm64 + x64) 和 windows (x64) 并发布 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 发布 Release 需要写权限

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 起是 Apple Silicon；macos-latest 目前也解析到 macOS 15 (arm64)
          - os: macos-arm64
            runner: macos-14
            artifact: local-music-macos-arm64
          # ⚠️ macos-13 已于 2025-12-04 彻底退役，用它任务会直接失败。
          # x86_64 必须改用 macos-15-intel（最后一个 Intel 镜像，2027-08 退役）。
          - os: macos-x64
            runner: macos-15-intel
            artifact: local-music-macos-x64
          - os: windows-x64
            runner: windows-latest
            artifact: local-music-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          mv local-music "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          # 用 tar.gz 打包，保留可执行权限（裸文件下载后会丢失 +x）
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          rm "${{ matrix.artifact }}"
          ls -la

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv dist/local-music.exe "dist/${{ matrix.artifact }}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # 只在打 tag 时发布；用 !cancelled() 而不是依赖 build 成功，
    # 这样某一个平台构建失败时，其余平台（尤其是 Windows exe）照样能发出来，
    # 不会因为 mac 单点抖动导致一个 Release 都出不来。
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Prepare release folder
        run: |
          mkdir -p release
          find release-assets -type f -exec cp {} release/ \;
          ls -la release/

      # 浏览器插件没有编译步骤，只是一堆静态文件，所以不占构建矩阵，
      # 在这里直接打成 zip 挂进 Release，让「只下了 exe 的人」也能拿到插件。
      # 注意：必须是 zip 解压后的**目录**（load unpacked），不能做成 .crx ——
      # Chrome 137+ 会拦截非商店来源的 crx 侧载。
      - name: Package browser extension (MV3)
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")"
          if [ "v${VER}" != "${TAG}" ]; then
            echo "::warning title=插件版本与 tag 不一致::extension/manifest.json 里是 ${VER}，但 tag 是 ${TAG}。建议把 manifest.json 的 version 改成 ${TAG#v} 后再重新打 tag。"
          fi
          # 只打包运行期需要的文件，排除：
          #   .DS_Store      macOS 垃圾文件
          #   make_icons.py  图标生成脚本（开发用）
          #   icons/cover.png 图标源图（1 MB，仅 make_icons.py 用得到）
          rm -rf /tmp/ext-pkg && mkdir -p /tmp/ext-pkg
          rsync -a \
            --exclude '.DS_Store' \
            --exclude 'make_icons.py' \
            --exclude 'icons/cover.png' \
            extension/ /tmp/ext-pkg/local-music-extension/
          # 顶层目录名固定成 local-music-extension，用户解压后直接选它「加载已解压的扩展程序」
          (cd /tmp/ext-pkg && zip -rq "${GITHUB_WORKSPACE}/release/local-music-extension-${TAG}.zip" local-music-extension)
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
